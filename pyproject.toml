[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "nodetool-mlx"
version = "0.7.2"
description = "Apple Silicon MLX nodes for Nodetool"
readme = "README.md"
authors = [{ name = "Matthias Georgi", email = "matti.georgi@gmail.com" }]
requires-python = ">=3.11"
# MLX runs only on Apple Silicon. Every MLX runtime dependency carries the
# Apple Silicon environment marker, so a Windows or Linux install pulls only
# nodetool-core and the small helpers the node modules import. Without the
# marker, Linux resolves mflux to mlx[cuda13] and torch (several GB) for nodes
# that cannot run. Keep the marker identical on every MLX-only line.
dependencies = [
    "nodetool-core>=0.8.2",
    # mflux caps huggingface-hub below 2.0; transformers 5.19 needs >=1.31.
    "huggingface-hub>=1.33.0,<2",
    # Same floor as nodetool-core. Do not raise it to 2.4: nodetool-huggingface
    # needs mistral-common, which caps numpy below 2.4 on Python 3.11 and 3.12.
    "numpy>=2.3.5",
    "pydub>=0.25.1",
    "mlx>=0.32.3; sys_platform == 'darwin' and platform_machine == 'arm64'",
    "mlx-lm>=0.32.0; sys_platform == 'darwin' and platform_machine == 'arm64'",
    "mlx-vlm>=0.7.6; sys_platform == 'darwin' and platform_machine == 'arm64'",
    "mlx-audio>=0.5.8; sys_platform == 'darwin' and platform_machine == 'arm64'",
    "mlx-whisper>=0.4.3; sys_platform == 'darwin' and platform_machine == 'arm64'",
    "mflux>=0.22.0; sys_platform == 'darwin' and platform_machine == 'arm64'",
    # Stable Audio 3 T5Gemma tokenizer
    "sentencepiece>=0.2.2; sys_platform == 'darwin' and platform_machine == 'arm64'",
    # mlx-whisper declares numba without a floor; keep a Python 3.11+ build.
    "numba>=0.68.0; sys_platform == 'darwin' and platform_machine == 'arm64'",
]

[project.urls]
Repository = "https://github.com/nodetool-ai/nodetool-mlx"

# Node discovery: nodetool-core's worker reads this group and imports
# nodetool.nodes.<value>.
[project.entry-points."nodetool.namespaces"]
mlx = "mlx"

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.5",
    "pytest-cov>=4.1.0",
    "black>=24.10.0",
    "ruff>=0.3.4",
    "mypy>=1.9.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["src/nodetool"]
include = [
    "src/nodetool/package_metadata/*.json",
    "src/nodetool/assets/**/*.jpg",
    "src/nodetool/mlx/stable_audio_3/LICENSE",
    "src/nodetool/mlx/stable_audio_3/NOTICE.md",
]

# The Stable Audio 3 model definitions under stable_audio_3/defs are vendored
# verbatim from Stability AI's MIT-licensed MLX implementation. Keep them out of
# our linters/formatters so they stay byte-for-byte diffable against upstream.
[tool.ruff]
extend-exclude = ["src/nodetool/mlx/stable_audio_3/defs"]

# Pin the rule set explicitly. Ruff's implicit defaults have widened over
# releases, so relying on them makes the lint gate fail on a new ruff release
# rather than on a code change. These are pyflakes plus the pycodestyle errors
# that catch real mistakes; widen deliberately (and fix the fallout in the same
# change) rather than by upgrading the tool.
[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

[tool.ruff.lint.per-file-ignores]
# The provider stops on non-Apple platforms before importing the MLX stack.
"src/nodetool/mlx/mlx_provider.py" = ["E402"]

[tool.black]
extend-exclude = "src/nodetool/mlx/stable_audio_3/defs"

[tool.uv]
# Lock for the platforms the pack installs on. The MLX stack resolves only on
# macOS arm64; the other platforms lock nodetool-core and its helpers.
environments = [
    "sys_platform == 'darwin' and platform_machine == 'arm64'",
    "sys_platform == 'linux'",
    "sys_platform == 'win32'",
]
