[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "nodetool-mlx"
version = "0.7.0"
description = "Apple Silicon MLX nodes for Nodetool"
readme = "README.md"
authors = [{ name = "Matthias Georgi", email = "matti.georgi@gmail.com" }]
requires-python = ">=3.11"
dependencies = [
    "nodetool-core>=0.7.0-rc.8",
    "mlx>=0.30",
    "mlx-whisper>=0.4.3",
    "mlx-audio>=0.4.2",
    "mflux>=0.17.5",
    "huggingface-hub>=0.24.6",
    "numpy>=1.26",
    "mlx-lm>=0.31.1",
    "mlx-vlm>=0.4.4",
    # Stable Audio 3 T5Gemma tokenizer
    "sentencepiece>=0.2",
    # Pin numba to Python 3.11+ compatible version to override mlx-whisper's old dependency
    "numba>=0.62.1",
]

[project.optional-dependencies]
# For exact version pinning in production
stable = ["nodetool-core>=0.7.0-rc.8"]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.5",
    "pytest-cov>=4.1.0",
    "black>=24.10.0",
    "ruff>=0.3.4",
    "mypy>=1.9.0",
]

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["src/nodetool"]
include = [
    "src/nodetool/package_metadata/*.json",
    "src/nodetool/assets/**/*.jpg",
    "src/nodetool/mlx/stable_audio_3/LICENSE",
    "src/nodetool/mlx/stable_audio_3/NOTICE.md",
]
artifacts = ["package_metadata/nodetool-mlx.json"]

# The Stable Audio 3 model definitions under stable_audio_3/defs are vendored
# verbatim from Stability AI's MIT-licensed MLX implementation. Keep them out of
# our linters/formatters so they stay byte-for-byte diffable against upstream.
[tool.ruff]
extend-exclude = ["src/nodetool/mlx/stable_audio_3/defs"]

[tool.black]
extend-exclude = "src/nodetool/mlx/stable_audio_3/defs"
