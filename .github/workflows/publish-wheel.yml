name: Build and Publish Wheel

on:
  # Trigger on version tags
  push:
    tags:
      - "v*.*.*"

  # Manual trigger for testing
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release (e.g., 0.6.0)"
        required: true
        type: string
      prerelease:
        description: "Mark as prerelease"
        required: false
        default: false
        type: boolean
      publish_pypi:
        description: "Also publish to PyPI / TestPyPI"
        required: false
        default: "none"
        type: choice
        options:
          - none
          - testpypi
          - pypi

env:
  PACKAGE_NAME: ${{ github.event.repository.name }} # e.g., "nodetool-base"

jobs:
  validate:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.get-version.outputs.version }}
      tag-name: ${{ steps.get-version.outputs.tag-name }}
      is-prerelease: ${{ steps.get-version.outputs.is-prerelease }}
    steps:
      - name: Get version from tag or input
        id: get-version
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            VERSION="${{ github.event.inputs.version }}"
            TAG_NAME="v${VERSION}"
            IS_PRERELEASE="${{ github.event.inputs.prerelease }}"
          else
            TAG_NAME="${{ github.ref_name }}"
            VERSION="${TAG_NAME#v}"
            IS_PRERELEASE="false"
          fi

          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "tag-name=$TAG_NAME" >> $GITHUB_OUTPUT
          echo "is-prerelease=$IS_PRERELEASE" >> $GITHUB_OUTPUT

          echo "📋 Version: $VERSION"
          echo "🏷️ Tag: $TAG_NAME"
          echo "🔄 Prerelease: $IS_PRERELEASE"

  # Build once. The GitHub Release and PyPI receive these same files, built
  # from the tagged source with no helper script fetched from another repo.
  build-wheel:
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          ref: ${{ needs.validate.outputs.tag-name }}

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.11"

      - name: Verify tag matches the package version
        env:
          EXPECTED_VERSION: ${{ needs.validate.outputs.version }}
        run: |
          PACKAGE_VERSION="$(python3 -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')"
          test "$EXPECTED_VERSION" = "$PACKAGE_VERSION" || {
            echo "Release version $EXPECTED_VERSION does not match package version $PACKAGE_VERSION" >&2
            exit 1
          }

      - name: Verify the lock file matches pyproject.toml
        run: uv lock --check

      - name: Build sdist + wheel
        run: uv build

      - name: Validate distributions
        run: uvx twine check dist/*

      - name: Upload distributions
        uses: actions/upload-artifact@v7
        with:
          name: dist-${{ env.PACKAGE_NAME }}-${{ needs.validate.outputs.version }}
          path: dist/
          if-no-files-found: error
          retention-days: 30

  create-release:
    needs: [validate, build-wheel]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download distributions
        uses: actions/download-artifact@v8
        with:
          name: dist-${{ env.PACKAGE_NAME }}-${{ needs.validate.outputs.version }}
          path: dist/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ needs.validate.outputs.tag-name }}
          name: "${{ env.PACKAGE_NAME }} v${{ needs.validate.outputs.version }}"
          body: |
            Install from PyPI:

            ```bash
            pip install ${{ env.PACKAGE_NAME }}==${{ needs.validate.outputs.version }}
            ```

            The MLX runtime dependencies install only on macOS arm64 (Apple Silicon).
          files: dist/*
          draft: false
          prerelease: ${{ needs.validate.outputs.is-prerelease }}
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # Publish to PyPI via Trusted Publishing (OIDC). No stored tokens.
  # Runs on every v*.*.* tag push, or a manual run with publish_pypi=pypi.
  # PyPI pending publisher: workflow publish-wheel.yml, environment pypi.
  publish-pypi:
    needs: [validate, build-wheel]
    if: github.event_name == 'push' || github.event.inputs.publish_pypi == 'pypi'
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/nodetool-mlx/
    permissions:
      id-token: write # required for OIDC trusted publishing
    steps:
      - name: Download distributions
        uses: actions/download-artifact@v8
        with:
          name: dist-${{ env.PACKAGE_NAME }}-${{ needs.validate.outputs.version }}
          path: dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1

  # Manual-only TestPyPI dry run (publish_pypi=testpypi).
  publish-testpypi:
    needs: [validate, build-wheel]
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.publish_pypi == 'testpypi'
    runs-on: ubuntu-latest
    environment:
      name: testpypi
      url: https://test.pypi.org/project/nodetool-mlx/
    permissions:
      id-token: write
    steps:
      - name: Download distributions
        uses: actions/download-artifact@v8
        with:
          name: dist-${{ env.PACKAGE_NAME }}-${{ needs.validate.outputs.version }}
          path: dist/

      - name: Publish to TestPyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/
