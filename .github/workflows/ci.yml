name: CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

# A new push to a PR makes the in-flight run obsolete.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    name: Lint and format
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip

      - name: Install linters
        # Pinned: an unpinned linter turns an upstream release into a red build
        # on an unrelated PR. Bump deliberately, fixing any new findings in the
        # same change. Keep in sync with requirements-dev.txt.
        run: pip install "ruff==0.15.8" "black==26.3.1"

      - name: ruff
        run: ruff check .

      - name: black
        run: black --check --diff .

      - uses: astral-sh/setup-uv@v5

      - name: uv.lock is current
        run: uv lock --check

      # The desktop app installs every pack into one environment, so this pack
      # must resolve next to the published nodetool-huggingface on each platform
      # the app supports. A dependency floor that HF cannot meet fails here.
      - name: Resolves together with nodetool-huggingface
        env:
          MACOSX_DEPLOYMENT_TARGET: "14.0"
        run: |
          for platform in aarch64-apple-darwin x86_64-manylinux_2_35 x86_64-pc-windows-msvc; do
            echo "::group::$platform"
            printf '%s\n' . 'nodetool-huggingface>=0.8.2' |
              uv pip compile --quiet --no-config --python-version 3.11 \
                --python-platform "$platform" -o "$RUNNER_TEMP/mlx-hf-resolve.txt" -
            echo "::endgroup::"
          done

  # The MLX runtimes (mlx, mflux, mlx-audio, ...) are Apple Silicon only, and
  # pyproject.toml gates them with an environment marker. A Linux install must
  # therefore pull nodetool-core and the small helpers only, never mlx or torch.
  # This job is the fast signal on every push, and it also covers the "node
  # modules import without the MLX stack" property that the package metadata
  # scanner relies on.
  test-linux:
    name: Test (linux, no MLX runtime)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install package and test dependencies
        run: |
          pip install --upgrade pip
          pip install -e .
          pip install pytest pytest-asyncio pytest-cov

      - name: MLX stack is not installed off Apple Silicon
        run: |
          ! pip show mlx mflux mlx-lm mlx-vlm mlx-audio mlx-whisper torch 2>/dev/null | grep -q '^Name:'

      - name: Run tests
        # Tests needing mflux / mlx-audio skip themselves via importorskip.
        run: pytest tests -q

  # The real thing: Apple Silicon runners install the full dependency set, so
  # nothing is skipped here. Slower and heavier, hence a single Python version.
  test-macos:
    name: Test (macOS, full MLX runtime)
    runs-on: macos-14
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip

      - name: Install package with all dependencies
        run: |
          pip install --upgrade pip
          pip install -e .
          pip install pytest pytest-asyncio pytest-cov

      - name: Show installed MLX stack
        run: pip list | grep -Ei "^(mlx|mflux|nodetool)" || true

      - name: Run tests
        run: pytest tests -q

  build:
    name: Build wheel
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip

      - name: Install build tooling
        run: pip install --upgrade pip build twine

      - name: Build sdist and wheel
        run: python -m build

      - name: Check distributions
        run: twine check dist/*
