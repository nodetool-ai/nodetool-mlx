name: Integration Tests (macOS)

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main
      - develop
  workflow_dispatch:

jobs:
  test:
    name: Integration Tests on Apple Silicon
    runs-on: macos-14  # macOS 14 (Sonoma) on Apple Silicon (M1)
    timeout-minutes: 30
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
      
      - name: Verify Apple Silicon
        run: |
          echo "System information:"
          uname -a
          sysctl -n machdep.cpu.brand_string || echo "CPU info not available"
          echo "Python version:"
          python --version
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .
          pip install -r requirements-dev.txt
      
      - name: Run integration tests
        run: |
          pytest tests/integration/ -v --tb=short --junit-xml=pytest-report.xml
        env:
          PYTHONPATH: ${{ github.workspace }}/src
      
      - name: Generate test summary
        if: always()
        run: |
          echo "## Integration Test Results :test_tube:" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          if [ -f pytest-report.xml ]; then
            echo "Tests completed. Check artifacts for detailed results." >> $GITHUB_STEP_SUMMARY
          else
            echo "Test report not generated." >> $GITHUB_STEP_SUMMARY
          fi
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Platform: macOS 14 (Apple Silicon)" >> $GITHUB_STEP_SUMMARY
          echo "Python: 3.11" >> $GITHUB_STEP_SUMMARY
      
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-macos
          path: |
            pytest-report.xml
          retention-days: 30
